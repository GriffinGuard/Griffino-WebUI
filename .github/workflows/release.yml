name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Compute version & asset name
        id: meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "asset=griffino-webui_${VER}.tar.gz" >> "$GITHUB_OUTPUT"

          # Prerelease: any suffixed version (e.g. v0.1.0-dev, v0.1.0-beta)
          case "$VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Package dist (flat root layout)
        shell: bash
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          tar -czf "$ASSET" -C dist .

      - name: Generate checksum
        shell: bash
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          shasum -a 256 "$ASSET" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.meta.outputs.ver }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.asset }}
            checksums.txt
